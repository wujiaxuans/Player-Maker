<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <filter id="mist" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .016" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .64 0 0 0 0 .70 0 0 0 0 .76 0 0 0 2 -.5"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="fade"><stop offset="0" stop-color="white"/><stop offset=".5" stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
    <mask id="edge"><rect width="1200" height="600" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="600" filter="url(#mist)" mask="url(#edge)"/>
</svg>
